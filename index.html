<title>Ticket Option App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d3182c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>

/* Layout: single-column mobile app shell, scrolling content, fixed bottom tab bar, bottom sheets for create and checkout. */
:root{
  --bg:#f6f3f2; --surface:#ffffff; --fg:#1d1416; --muted:#7b6f72; --line:#e8e0e1;
  --accent:#d3182c; --accent-ink:#ffffff; --accent-soft:#fbe4e7;
  --ok:#17935f; --ok-soft:#dff3ea; --warn:#f4b400; --warn-ink:#3a2c00; --hot:#e8123f;
  --overlay:rgba(20,10,12,.55);
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130f10; --surface:#1d1719; --fg:#f5eeee; --muted:#a2969a; --line:#312729;
  --accent:#ef3347; --accent-ink:#ffffff; --accent-soft:#3a1a1f;
  --ok:#35c58a; --ok-soft:#14352a; --warn:#f4b400; --warn-ink:#2b2100; --hot:#ff4a6d;
  --overlay:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f10; --surface:#1d1719; --fg:#f5eeee; --muted:#a2969a; --line:#312729;
  --accent:#ef3347; --accent-ink:#ffffff; --accent-soft:#3a1a1f;
  --ok:#35c58a; --ok-soft:#14352a; --warn:#f4b400; --warn-ink:#2b2100; --hot:#ff4a6d;
  --overlay:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{height:100%;max-width:520px;margin:0 auto;position:relative;display:flex;flex-direction:column}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:24px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}

/* top bars */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:17px}
.flag{width:22px;height:15px;border-radius:2px;display:inline-block;overflow:hidden;flex:none}
.round-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative}
.round-btn.filled{background:var(--surface);border:1px solid var(--line)}
.badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.icons{display:flex;gap:4px}

.search{display:flex;align-items:center;gap:10px;height:50px;border-radius:25px;border:1px solid var(--line);background:var(--surface);padding:0 18px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg)}
.search input::placeholder{color:var(--muted)}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.section-head p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:23px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn.block{display:flex;width:100%;height:52px;border-radius:26px;font-size:16px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active{transform:scale(.985)}

/* horizontal rails */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:none}

/* event card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;width:min(86%,340px);text-align:left}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-width:0}
.meta .ic{width:18px;height:18px;flex:none}
.meta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.likes{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:13px;gap:2px;flex:none}

/* poster */
.poster{position:relative;aspect-ratio:4/3;overflow:hidden;color:#fff;isolation:isolate}
.poster.tall{aspect-ratio:3/2}
.poster .bg{position:absolute;inset:0;z-index:-2}
.poster .shape{position:absolute;z-index:-1;border-radius:50%}
.poster .tag{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:6px 14px;font-size:14px;font-weight:500}
.poster .verified{position:absolute;right:12px;top:12px;width:38px;height:36px;border-radius:10px;background:#35b886;display:grid;place-items:center}
.poster .verified .ic{width:20px;height:20px;color:#fff}
.poster .big{position:absolute;left:16px;right:16px;bottom:14px;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,11vw,56px);line-height:.88;letter-spacing:-.03em;text-transform:uppercase;text-wrap:balance}
.poster .small{position:absolute;left:16px;bottom:calc(14px + 100% * 0);font-size:12px}
.poster .when{position:absolute;right:14px;bottom:14px;font-family:var(--f-display);font-weight:700;font-size:13px;text-align:right;line-height:1.2;text-transform:uppercase;letter-spacing:.04em}

/* cotisation */
.coti{width:min(86%,340px)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.coti-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.coti-row b{color:var(--fg);font-family:var(--f-display);font-size:16px}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;background:var(--surface);border-top:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:16px;font-size:12px;font-weight:500;color:var(--muted)}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 20px rgba(211,24,44,.35)}
.fab .ic{width:28px;height:28px;stroke-width:2.2}
.avatar{width:100px;height:100px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:38px;border:5px solid var(--bg);margin-top:-50px}
.avatar.mini{width:26px;height:26px;font-size:11px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);margin:0}

/* detail */
.detail-top{display:flex;justify-content:space-between;padding:14px 0 8px}
.detail-top .round-btn{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.detail h1{margin:6px 0 0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.detail .sub{color:var(--muted);font-weight:500;font-size:17px;margin-top:2px}
.detail .rows{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.detail .row{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.detail .row .ic{color:var(--muted);margin-top:1px;flex:none}
.detail .row a,.detail .row .org{color:var(--accent);font-weight:500}
.tabs2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:18px 0 16px}
.tabs2 button{padding:14px 0;font-size:18px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs2 button.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.dates{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.date-chip{min-width:132px;padding:12px 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:left}
.date-chip small{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.date-chip strong{display:block;font-family:var(--f-display);font-size:34px;line-height:1;margin:2px 0}
.date-chip span{font-size:14px;color:var(--muted)}
.date-chip.on{background:var(--accent-soft);border-color:var(--accent)}
.date-chip.on strong,.date-chip.on small{color:var(--accent)}
.label-cap{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 4px}
.venue-name{font-family:var(--f-display);font-weight:700;font-size:20px}
.tier{background:var(--surface);border-radius:20px;padding:16px;margin-top:14px;border:1px solid var(--line)}
.tier-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tier h4{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;text-transform:uppercase;text-wrap:balance;min-width:0}
.status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;font-size:12.5px;font-weight:700;text-transform:uppercase;white-space:nowrap;flex:none}
.status .ic{width:15px;height:15px}
.status.out{background:var(--accent-soft);color:var(--accent)}
.status.low{background:var(--warn);color:var(--warn-ink)}
.status.hot{background:var(--hot);color:#fff}
.tier-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.price{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.stepper button{width:46px;height:44px;display:grid;place-items:center}
.stepper button:disabled{opacity:.3}
.stepper output{width:44px;text-align:center;font-weight:700;font-size:17px;border-inline:1px solid var(--line);line-height:44px;font-variant-numeric:tabular-nums}
.tier details{margin-top:10px;color:var(--muted);font-size:14px}
.tier summary{color:var(--accent);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:15px}
.tier summary::-webkit-details-marker{display:none}
.tier details p{margin:8px 0 0}
.tier.soldout{opacity:.85}
.cartbar{position:sticky;bottom:0;margin:20px calc(-1 * max(16px,env(safe-area-inset-left,0px))) -24px;padding:12px max(16px,env(safe-area-inset-left,0px)) 14px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}
.cartbar .tot{flex:1;min-width:0}
.cartbar .tot small{color:var(--muted);display:block;font-size:13px}
.cartbar .tot b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.cartbar .btn{height:50px;padding:0 24px}
.about p{margin:0 0 12px;line-height:1.55}
.about dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
.about dt{color:var(--muted)} .about dd{margin:0;font-weight:500;min-width:0}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;border:1px solid var(--line);overflow:hidden}
.list-item{display:flex;align-items:center;gap:16px;padding:18px 16px;font-size:18px;text-align:left;width:100%}
.list-item+.list-item{border-top:1px solid var(--line)}
.list-item .ic{color:var(--muted)}
.list-item .chev{margin-left:auto;width:20px;height:20px}
.cover{height:128px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:linear-gradient(135deg,var(--accent),#8f0f1f);position:relative;overflow:hidden;color:#fff}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.06) 22px 23px)}
.cover .acts{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:14px;display:flex;gap:10px}
.cover .acts button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff}
.profile h1{margin:8px 0 2px;font-family:var(--f-display);font-weight:800;font-size:30px}
.profile .stats{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);margin:10px 0 18px}
.profile .stats b{color:var(--fg);font-family:var(--f-display);font-size:22px}

/* wallet */
.wallet-card{background:var(--surface);border-radius:26px;padding:22px;border:1px solid var(--line)}
.wallet-card .big{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.wallet-card .big small{font-size:18px;color:var(--muted);font-weight:500;margin-left:6px}
.wrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:17px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);padding:56px 24px}
.empty .ic{width:64px;height:64px;stroke-width:1.2;opacity:.6}
.empty h3{margin:8px 0 0;font-family:var(--f-display);font-size:22px;color:var(--fg)}
.empty p{margin:0;max-width:30ch}

/* orders */
.order{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:12px;width:100%;text-align:left;align-items:center}
.order .thumb{width:76px;height:76px;border-radius:14px;overflow:hidden;position:relative;flex:none}
.order .info{min-width:0;flex:1}
.order h4{margin:0;font-family:var(--f-display);font-size:16px;text-transform:uppercase;line-height:1.1}
.order small{color:var(--muted);display:block;margin-top:3px}
.tag-ok{display:inline-block;margin-top:6px;background:var(--ok-soft);color:var(--ok);border-radius:10px;font-size:12px;font-weight:700;padding:3px 10px;text-transform:uppercase}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:12px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .25s ease-out}
.sheet .grab{width:56px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 18px}
.sheet h3{margin:0 0 16px;font-family:var(--f-display);font-weight:800;font-size:25px;text-align:center;text-wrap:balance}
.choice{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--bg);border-radius:20px;padding:18px 16px;margin-bottom:12px}
.choice .circle{width:62px;height:62px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none}
.choice .circle .ic{width:28px;height:28px}
.choice b{display:block;font-family:var(--f-display);font-size:20px}
.choice span{color:var(--muted);font-size:15px;display:block;margin-top:2px}
.choice .chev{margin-left:auto;color:var(--muted);flex:none}
.cancel{display:block;width:100%;padding:16px;text-align:center;font-size:18px;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field input,.field select{height:50px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.op{border:1.5px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;font-weight:700;font-size:13.5px;line-height:1.15;background:var(--bg)}
.op i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 8px}
.op.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sum{background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
.sum div.t{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-family:var(--f-display);font-size:18px}
.sum span{color:var(--muted)} .sum div.t span{color:var(--fg)}

/* ticket */
.ticket{background:var(--bg);border-radius:22px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.ticket .tp{padding:16px}
.ticket h4{margin:0 0 6px;font-family:var(--f-display);font-size:21px;text-transform:uppercase;line-height:1.05}
.ticket .perf{border-top:2px dashed var(--line);position:relative;padding:16px;display:flex;gap:16px;align-items:center}
.ticket .perf::before,.ticket .perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--surface)}
.ticket .perf::before{left:-10px}.ticket .perf::after{right:-10px}
.qr{width:96px;height:96px;flex:none;color:var(--fg)}
.success-ic{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:4px auto 12px}
.success-ic .ic{width:34px;height:34px;stroke-width:2.4}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:14px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:24px;font-weight:500;z-index:80;animation:fade .2s;max-width:90%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- ajouts v2 : installation, tickets, liens ---- */
a.list-item{color:inherit;text-decoration:none}
a.btn{text-decoration:none}
.field input,.field select,.search input{font-size:16px}
.list-item.accent{color:var(--accent);font-weight:700}

function submitForm(e) {
  e.preventDefault();

  var status = (e.submitter && e.submitter.value) || 'published';
  var fail = function (m, f) { err.textContent = m; var x = typeof f === 'string' ? document.getElementById(f) : f; if (x) x.focus(); };
  if (!t) return fail('Ajoutez un nom pour continuer.', 'f-title');

    if (!dates.length || dates.some(function (x) { return !x.iso; })) return fail('Chaque date doit être remplie.', document.querySelector('#dates .d-iso'));
    var tiers = [].map.call(document.querySelectorAll('#tiers .tr'), function (r) { return { id: r.getAttribute('data-id'), sold: +r.getAttribute('data-sold') || 0, name: r.querySelector('.t-name').value.trim(), price: r.querySelector('.t-price').value, stock: r.querySelector('.t-stock').value, desc: r.querySelector('.t-desc').value.trim(), el: r }; });

      if (x.stock === '' || isNaN(+x.stock) || +x.stock < 1) return fail('Indiquez au moins une place pour « ' + x.name + ' ».', x.el.querySelector('.t-stock'));
      if (+x.stock < x.sold) return fail('« ' + x.name + ' » a déjà ' + x.sold + ' billets vendus : les places ne peuvent pas descendre sous ce nombre.', x.el.querySelector('.t-stock'));
    }

    var cur = id ? getEv(id) : null;

    if (!cur) { o.org = d.buyer.name || 'Organisateur'; o.pal = pal; o.likes = 0; o.device = d.device; }
    TO.upsertEvent(o);

    var g = parseInt(document.getElementById('f-goal').value, 10);

    if (id) { var c0 = getCo(id); c0.title = t; c0.cat = document.getElementById('f-cat').value; c0.goal = g; TO.commit(); }
    else TO.addCollect({ title: t, cat: document.getElementById('f-cat').value, cc: S.country, raised: 0, goal: g, donors: 0, pal: [pal[0], pal[1]], device: d.device });
    S.stack = []; S.tab = 'posts'; S.ptab = 'coll'; render(); toast('Cotisation publiée');
  }
}

    case 'resetme-yes': TO.reset(); closeSheet(); S.stack = []; S.tab = 'home'; S.qty = {}; S.coupon = {}; render(); toast('Données remises à zéro'); break;
    case 'help': sheetHelp(); break;
    case 'help-go': var hm = TO.sendMessage({ name: db().buyer.name, contact: val('h-c'), text: val('h-t') }); if (hm.error) { document.getElementById('h-err').textContent = hm.error; break; } closeSheet(); toast('Message envoyé. Nous vous répondons vite.'); break;
    case 'rate': sheetRate(); break;
    case 'star': S.stars = +v; [].forEach.call(document.querySelectorAll('#stars button'), function (b, i) { b.classList.toggle('on', i < S.stars); }); break;
    case 'rate-go': var rv = TO.addReview({ stars: S.stars, text: val('r-t') }); if (rv.error) { document.getElementById('r-err').textContent = rv.error; break; } closeSheet(); toast('Merci pour votre avis'); break;
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'gate-code') { e.preventDefault(); var b = document.querySelector('[data-act="gate-go"]'); if (b) b.click(); } if (e.key === 'Enter' && e.target && (e.target.id === 'cpn' || e.target.id === 'claim')) { e.preventDefault(); var b2 = document.querySelector(e.target.id === 'cpn' ? '[data-act="cpn-apply"]' : '[data-act="claim"]'); if (b2) b2.click(); } });

/* ---------- installation (PWA) ---------- */
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.deferred = e; });
window.addEventListener('appinstalled', function () { S.deferred = null; toast('Application installée'); render(true); });
function installApp() {
  if (S.deferred) { S.deferred.prompt(); S.deferred.userChoice.then(function () { S.deferred = null; render(true); }); return; }
  sheetInstall();
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); }); }

/* ---------- synchronisation avec l'admin (même navigateur) ---------- */
TO.on(function () {
  var ae = document.activeElement;
  if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  if (document.getElementById('sheet') && !S.openOrder) return;
  render(true);
  if (S.openOrder && document.getElementById('tkrail')) { var sc = document.getElementById('tkrail').scrollLeft; sheetTickets(S.openOrder, false); document.getElementById('tkrail').scrollLeft = sc; }
});
/* ---------- inscription / connexion ---------- */
function authView(mode) {
  var su = mode === 'signup';
  var h = '<div class="authbox"><div class="auth-logo" aria-hidden="true">' + ic('ticket') + '</div><h1>Ticket Option</h1><p class="hint">' + (su ? 'Créez votre compte en 20 secondes. Vous ne le ferez qu\'une seule fois.' : 'Content de vous revoir. Entrez votre numéro et votre code secret.') + '</p>' +
    '<div class="seg" role="tablist"><button role="tab" aria-selected="' + su + '" class="' + (su ? 'on' : '') + '" data-act="authmode" data-v="signup">Inscription</button><button role="tab" aria-selected="' + !su + '" class="' + (su ? '' : 'on') + '" data-act="authmode" data-v="login">Se connecter</button></div>' +
    '<form id="authform" novalidate>' + (su ? '<div class="field"><label for="a-name">Nom complet</label><input id="a-name" autocomplete="name" placeholder="Ex. Awa Ouédraogo"></div>' : '') +
    '<div class="field"><label for="a-phone">Téléphone</label><input id="a-phone" inputmode="tel" autocomplete="tel" placeholder="70 00 00 00"></div>' +
    (su ? '<div class="field"><label for="a-mail">E-mail (facultatif)</label><input id="a-mail" type="email" autocomplete="email" placeholder="vous@exemple.com"></div>' : '') +
    '<div class="field"><label for="a-pin">Code secret (4 à 6 chiffres)</label><input id="a-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="' + (su ? 'new-password' : 'current-password') + '" placeholder="••••"></div>' +
    (su ? '<div class="field"><label for="a-pin2">Confirmez le code secret</label><input id="a-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="••••"></div>' : '') +
    '<p class="note-err" id="a-err" role="alert"></p><button class="btn block" type="submit" id="a-go">' + (su ? 'Créer mon compte' : 'Me connecter') + '</button></form>' +
    (su ? '' : '<p class="hint" style="margin-top:14px">Code oublié ? Écrivez-nous depuis l\'aide de l\'application avec votre numéro, nous réinitialisons votre accès.</p>') +
    '<p class="hint" style="margin-top:14px">' + (AUTH.online() ? 'Votre compte est enregistré en ligne : retrouvez-le sur n\'importe quel téléphone.' : 'Mode local : le compte est conservé sur cet appareil uniquement.') + '</p></div>';
  var el = document.getElementById('auth'); if (!el) { el = document.createElement('div'); el.id = 'auth'; el.className = 'authscreen'; document.body.appendChild(el); }
  el.innerHTML = h; el.hidden = false; document.getElementById('app').hidden = true;
  var f = document.getElementById('authform'), g = function (i) { var x = document.getElementById(i); return x ? x.value.trim() : ''; };
  f.addEventListener('submit', function (e) {
    e.preventDefault(); var b = document.getElementById('a-go'), er = document.getElementById('a-err'); er.textContent = ''; b.disabled = true; b.textContent = 'Un instant…';
    var p = su ? AUTH.signup({ name: g('a-name'), phone: g('a-phone'), email: g('a-mail'), pin: g('a-pin'), pin2: g('a-pin2') }) : AUTH.login({ phone: g('a-phone'), pin: g('a-pin') });
    p.then(function (r) {
      if (r.error) { er.textContent = r.error; b.disabled = false; b.textContent = su ? 'Créer mon compte' : 'Me connecter'; return; }
      enterApp(r.user);
    });
  });
  var first = document.getElementById(su ? 'a-name' : 'a-phone'); if (first) first.focus();
}
function enterApp(u) {
  var b = db().buyer || {};
  TO.setBuyer({ name: u.name, phone: u.phone, email: u.email || b.email || '' });
  var el = document.getElementById('auth'); if (el) el.hidden = true; document.getElementById('app').hidden = false;
  S.stack = []; S.tab = 'home'; render(); toast('Bienvenue ' + u.name.split(' ')[0]);
}
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-act=authmode],[data-act=logout]'); if (!el) return;
  if (el.getAttribute('data-act') === 'authmode') authView(el.getAttribute('data-v'));
  else { AUTH.logout(); closeSheet(); authView('login'); }
});
applyTheme();
var _s = AUTH.session();
if (_s) { document.getElementById('app').hidden = false; render(); } else authView('signup');

})();
</script>
